name: Update BT Node Reference Docs

on:
  push:
    branches:
      - "master"

jobs:
  generate_node_reference:
    uses: AutoAPMS/auto-apms/.github/workflows/build-and-test-reusable.yaml@master
    with:
      ros_distribution: jazzy
      docker_image: ubuntu:noble
      package_name: auto_apms_ros2control
      vcs_repo_file_url: ${GITHUB_WORKSPACE}/update_node_reference_deps.repos
      skip_tests: true
      node_reference_manifests: auto_apms_ros2control::behavior_tree_nodes
      node_reference_file: create_node_reference_markdown_output_ros2control.md

  update_node_reference:
    needs: generate_node_reference
    uses: AutoAPMS/auto-apms/.github/workflows/update-node-reference-reusable.yaml@master
    with:
      node_reference_file: create_node_reference_markdown_output_ros2control.md
      commit_message: Update ros2_control behavior tree node reference
    secrets: inherit
